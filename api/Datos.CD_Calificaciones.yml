  namespace: Datos
  summary: Registra una nueva calificación para un estudiante en una asignatura específica.
  example: []
  syntax:
    content: public bool CD_CrearCalificacion(int estudianteID, int asignaturaID, decimal nota, DateTime fecha, int usuarioID)
    parameters:
    - id: estudianteID
      type: System.Int32
      description: Identificador único del estudiante.
    - id: asignaturaID
      type: System.Int32
      description: Identificador único de la asignatura.
    - id: nota
      type: System.Decimal
      description: Valor de la nota obtenida.
    - id: fecha
      type: System.DateTime
      description: Fecha en la que se registra la calificación.
    - id: usuarioID
      type: System.Int32
      description: Identificador del usuario que registra la calificación.
    return:
      type: System.Boolean
      description: Retorna true si la calificación se registró exitosamente, false en caso contrario.
