  assemblies:
  - Datos
  namespace: Datos
  summary: Obtiene todas las calificaciones registradas en el sistema.
  remarks: >-
    Este método ejecuta el procedimiento almacenado <code>SP_READ_LeerCalificaciones</code>

    para recuperar todos los registros de la tabla Calificaciones.
  example: []
  syntax:
    content: public DataTable CD_VerCalificaciones()
    return:
      type: System.Data.DataTable
      description: >-
        Retorna un <xref href="System.Data.DataTable" data-throw-if-not-resolved="false"></xref> que contiene todas las calificaciones

        con sus respectivos datos (CalificacionID, NombreEstudiante, NombreAsignatura, 

        Nota, FechaRegistro).

        Si no hay calificaciones, retorna un DataTable vacío.
    content.vb: Public Function CD_VerCalificaciones() As DataTable
  overload: Datos.CD_Calificaciones.CD_VerCalificaciones*
  exceptions:
  - type: System.Exception
    commentId: T:System.Exception
    description: Se lanza una excepción si ocurre un error durante la consulta a la base de datos.
