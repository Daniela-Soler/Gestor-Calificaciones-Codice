  assemblies:
  - Negocio
  namespace: Negocio
  summary: >-
    Registra un nuevo usuario en el sistema con validaciones de campos obligatorios.

    Valida que nombre, correo y contraseña no estén vacíos antes de proceder con el registro.
  example: []
  syntax:
    content: public bool IngresarUsuario(string nombre, string correo, string clave)
    parameters:
    - id: nombre
      type: System.String
      description: Nombre del usuario.
    - id: correo
      type: System.String
      description: Correo electrónico del usuario.
    - id: clave
      type: System.String
      description: Contraseña del usuario.
    return:
      type: System.Boolean
      description: Retorna true si el usuario se registró exitosamente, false en caso contrario.
    content.vb: Public Function IngresarUsuario(nombre As String, correo As String, clave As String) As Boolean
  overload: Negocio.CN_Usuario.IngresarUsuario*
  exceptions:
  - type: System.Exception
    commentId: T:System.Exception
    description: Se lanza cuando los campos obligatorios están vacíos o hay errores al registrar el usuario.
