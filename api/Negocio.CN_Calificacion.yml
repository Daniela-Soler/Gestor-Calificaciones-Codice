  assemblies:
  - Negocio
  namespace: Negocio
  summary: >-
    Registra una nueva calificación para un estudiante con validaciones de negocio.

    Valida que la nota esté en el rango permitido (0 a 7).
  example: []
  syntax:
    content: public bool CN_IngresarCalificacion(int estudianteID, int asignaturaID, decimal nota, DateTime fecha, int usuarioID)
    parameters:
    - id: estudianteID
      type: System.Int32
      description: Identificador único del estudiante.
    - id: asignaturaID
      type: System.Int32
      description: Identificador único de la asignatura.
    - id: nota
      type: System.Decimal
      description: Valor de la nota obtenida (debe estar entre 0 y 7).
    - id: fecha
      type: System.DateTime
      description: Fecha en la que se registra la calificación.
    - id: usuarioID
      type: System.Int32
      description: Identificador del usuario que registra la calificación.
    return:
      type: System.Boolean
      description: Retorna true si la calificación se registró exitosamente, false en caso contrario.
