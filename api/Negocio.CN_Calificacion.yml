  assemblies:
  - Negocio
  namespace: Negocio
  summary: >-
    Actualiza los datos de una calificación existente con validaciones de negocio.

    Valida que la nota esté en el rango permitido (0 a 7).
  example: []
  syntax:
    content: public bool CN_ActualizarCalificacion(int calificacionID, int estudianteID, int asignaturaID, decimal nota, DateTime fecha, int usuarioID)
    parameters:
    - id: calificacionID
      type: System.Int32
      description: Identificador único de la calificación a actualizar.
    - id: estudianteID
      type: System.Int32
      description: Identificador único del estudiante.
    - id: asignaturaID
      type: System.Int32
      description: Identificador único de la asignatura.
    - id: nota
      type: System.Decimal
      description: Nuevo valor de la nota (debe estar entre 0 y 7).
    - id: fecha
      type: System.DateTime
      description: Nueva fecha de registro de la calificación.
    - id: usuarioID
      type: System.Int32
      description: Identificador del usuario que realiza la actualización.
    return:
      type: System.Boolean
      description: Retorna true si la calificación se actualizó exitosamente, false en caso contrario.
