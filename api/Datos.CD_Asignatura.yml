  assemblies:
  - Datos
  namespace: Datos
  summary: Actualiza los datos de una asignatura existente en la base de datos.
  remarks: >-
    Este método ejecuta el procedimiento almacenado <code>SP_UPDATE_ActualizarAsignatura</code>

    para modificar los datos de una asignatura existente en la tabla Asignatura.
  example: []
  syntax:
    content: public bool CD_ActualizarAsignatura(int asignaturaID, int cursoID, string nombre, int usuarioID)
    parameters:
    - id: asignaturaID
      type: System.Int32
      description: ID de la asignatura a actualizar. Debe ser mayor a 0.
    - id: cursoID
      type: System.Int32
      description: Nuevo ID del curso al que pertenecerá la asignatura. Debe ser mayor a 0.
    - id: nombre
      type: System.String
      description: Nuevo nombre de la asignatura. No debe estar vacío.
    - id: usuarioID
      type: System.Int32
      description: ID del usuario que realiza la operación. Debe ser mayor a 0.
    return:
      type: System.Boolean
      description: >-
        Retorna <code>true</code> si la asignatura se actualizó exitosamente; 

        <code>false</code> en caso contrario.
