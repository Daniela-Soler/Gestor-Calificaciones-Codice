    id: CD_CrearAsignatura
    path: C:\Users\spyro\Downloads\Taller de Programación\Prueba ENE\Tarea 3\Tarea 3D\Tarea 3 - Instituto Codice\Datos\CD_Asignatura.cs
    startLine: 37
  assemblies:
  - Datos
  namespace: Datos
  summary: Crea una nueva asignatura en la base de datos.
  remarks: >-
    Este método ejecuta el procedimiento almacenado <code>SP_CREATE_CrearAsignatura</code>

    para insertar un nuevo registro de asignatura en la tabla Asignatura.
  example: []
  syntax:
    content: public bool CD_CrearAsignatura(int cursoID, string nombre, int usuarioID)
    parameters:
    - id: cursoID
      type: System.Int32
      description: ID del curso al que pertenece la asignatura. Debe ser mayor a 0.
    - id: nombre
      type: System.String
      description: Nombre de la asignatura a crear. No debe estar vacío.
    - id: usuarioID
      type: System.Int32
      description: ID del usuario que realiza la operación. Debe ser mayor a 0.
    return:
      type: System.Boolean
      description: >-
        Retorna <code>true</code> si la asignatura se creó exitosamente; 

        <code>false</code> en caso contrario.
    content.vb: Public Function CD_CrearAsignatura(cursoID As Integer, nombre As String, usuarioID As Integer) As Boolean
  overload: Datos.CD_Asignatura.CD_CrearAsignatura*
  exceptions:
  - type: System.Exception
    commentId: T:System.Exception
    description: Se lanza una excepción si ocurre un error durante la operación en la base de datos.
