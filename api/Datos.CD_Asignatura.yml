  assemblies:
  - Datos
  namespace: Datos
  summary: Obtiene todas las asignaturas registradas en la base de datos.
  remarks: >-
    Este método ejecuta el procedimiento almacenado <code>SP_READ_LeerAsignaturas</code>

    para recuperar todos los registros de la tabla Asignatura.
  example: []
  syntax:
    content: public DataTable CD_VerAsignaturas()
    return:
      type: System.Data.DataTable
      description: >-
        Retorna un <xref href="System.Data.DataTable" data-throw-if-not-resolved="false"></xref> que contiene todas las asignaturas 

        con sus respectivos datos (AsignaturaID, NombreAsignatura y NombreCurso).

        Si no hay asignaturas, retorna un DataTable vacío.
