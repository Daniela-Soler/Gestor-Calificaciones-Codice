  assemblies:
  - Datos
  namespace: Datos
  summary: Obtiene todos los cursos registrados en el sistema.
  remarks: >-
    Este método ejecuta el procedimiento almacenado <code>SP_READ_LeerCursos</code>

    para recuperar todos los registros de la tabla Curso.
  example: []
  syntax:
    content: public DataTable CD_VerCursos()
    return:
      type: System.Data.DataTable
      description: >-
        Retorna un <xref href="System.Data.DataTable" data-throw-if-not-resolved="false"></xref> que contiene todos los cursos

        con sus respectivos datos (CursoID, NombreCurso).

        Si no hay cursos, retorna un DataTable vacío.
    content.vb: Public Function CD_VerCursos() As DataTable
