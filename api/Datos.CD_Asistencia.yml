    startLine: 75
  assemblies:
  - Datos
  namespace: Datos
  summary: Obtiene todas las asistencias registradas en el sistema.
  remarks: >-
    Este método ejecuta el procedimiento almacenado <code>SP_READ_LeerAsistencias</code>

    para recuperar todos los registros de la tabla Asistencia.
  example: []
  syntax:
    content: public DataTable CD_VerAsistencias()
    return:
      type: System.Data.DataTable
      description: >-
        Retorna un <xref href="System.Data.DataTable" data-throw-if-not-resolved="false"></xref> que contiene todas las asistencias

        con sus respectivos datos (AsistenciaID, EstudianteID, Estudiante, AsignaturaID,

        Asignatura, FechaAsistencia, Estado).

        Si no hay asistencias, retorna un DataTable vacío.
    content.vb: Public Function CD_VerAsistencias() As DataTable
  overload: Datos.CD_Asistencia.CD_VerAsistencias*
  exceptions:
  - type: System.Exception
    commentId: T:System.Exception
    description: Se lanza una excepción si ocurre un error durante la consulta a la base de datos.
