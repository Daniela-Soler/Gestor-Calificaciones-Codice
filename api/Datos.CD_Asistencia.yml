    startLine: 31
  assemblies:
  - Datos
  namespace: Datos
  summary: Registra una nueva asistencia de un estudiante en una asignatura específica.
  example: []
  syntax:
    content: public bool CD_IngresarAsistencia(int estudianteID, int asignaturaID, DateTime fecha, bool estado, int usuarioID)
    parameters:
    - id: estudianteID
      type: System.Int32
      description: Identificador único del estudiante.
    - id: asignaturaID
      type: System.Int32
      description: Identificador único de la asignatura.
    - id: fecha
      type: System.DateTime
      description: Fecha en la que se registra la asistencia.
    - id: estado
      type: System.Boolean
      description: Estado de la asistencia (true para presente, false para ausente).
    - id: usuarioID
      type: System.Int32
      description: Identificador del usuario que registra la asistencia.
    return:
      type: System.Boolean
      description: Retorna true si la asistencia se registró exitosamente, false en caso contrario.
    content.vb: Public Function CD_IngresarAsistencia(estudianteID As Integer, asignaturaID As Integer, fecha As Date, estado As Boolean, usuarioID As Integer) As Boolean
